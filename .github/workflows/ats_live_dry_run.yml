name: ATS Live Dry Run (read-only)

on:
  workflow_dispatch:
    inputs:
      source:
        description: ATS platform to scan (all covers the configured registry)
        type: choice
        required: true
        default: all
        options:
          - all
          - greenhouse
          - lever
          - ashby
          - personio
permissions:
  contents: read

concurrency:
  group: datapulse-ats-dry-run
  cancel-in-progress: false

jobs:
  verify:
    name: Verify public ATS feeds without writes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Inspect enabled ATS boards (zero database writes)
        env:
          ATS_SOURCE: ${{ inputs.source }}
        working-directory: backend
        run: |
          set -o pipefail
          if [ "$ATS_SOURCE" = "all" ]; then
            python -m app.collectors.run_ingestion --dry-run --max-boards 11
          else
            python -m app.collectors.run_ingestion --dry-run --source "$ATS_SOURCE"
          fi
