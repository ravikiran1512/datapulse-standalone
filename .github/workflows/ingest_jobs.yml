name: Daily Direct-ATS Job Ingestion
on:
 schedule:
 - cron: '17 5 * * *' # 05:17 UTC; not guaranteed exact execution time
 workflow_dispatch:
permissions:
 contents: read
concurrency:
 group: datapulse-daily-ingestion
 cancel-in-progress: false
jobs:
 ingest:
 if: ${{ vars.DATAPULSE_INGESTION_ENABLED == 'true' }}
 runs-on: ubuntu-latest
 timeout-minutes: 35
 steps:
 - name: Checkout
 uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
 with:
 persist-credentials: false
 - name: Set up Python
 uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
 with:
 python-version: '3.12'
 cache: 'pip'
 cache-dependency-path: backend/requirements.txt
 - name: Install
 run: pip install -r backend/requirements.txt
 - name: Run configured public ATS collectors
 env:
 API_BASE_URL: ${{ secrets.DATAPULSE_API_BASE_URL }}
 INGEST_TOKEN: ${{ secrets.DATAPULSE_INGEST_TOKEN }}
 run: |
 test -n "$API_BASE_URL"
 test -n "$INGEST_TOKEN"
 cd backend
 python -m app.collectors.run_ingestion --target api
