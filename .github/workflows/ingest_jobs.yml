name: Daily Approved ATS Preflight (read-only)
on:
  schedule:
    - cron: '23 7 * * *' # Follow-up after the production Vercel Cron, not a second writer
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: datapulse-daily-ingestion
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install and test
        run: |
          python -m pip install -r backend/requirements.txt pytest==9.2.0 pytest-asyncio==1.4.1.post1
          PYTHONPATH=backend python -m pytest -q backend/tests
      - name: Inspect only approved ATS postings and official live links
        run: |
          set -euo pipefail
          cd backend
          python -m app.collectors.run_ingestion --approved-only \
            --dry-run=true --verify-links \
            --output-report ../ingestion-report.json
      - name: Keep bounded ingestion report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: datapulse-approved-ats-report
          path: ingestion-report.json
          retention-days: 14
          if-no-files-found: warn
